<!DOCTYPE html>
<html>
<head>
    <title>RAG Chatbox</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        #chat { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        .msg { margin: 8px 0; }
        .user { font-weight: bold; }
        .bot { color: #333; }
        #upload-status { font-size: 0.9em; color: gray; margin-bottom: 10px; }
        input[type=text] { width: 80%; padding: 8px; }
        button { padding: 8px 12px; }
    </style>
</head>
<body>
    <h2>RAG Chatbox</h2>

    <input type="file" id="pdfFile" accept=".pdf" />
    <button onclick="uploadPdf()">Upload PDF</button>
    <div id="upload-status"></div>

    <div id="chat"></div>
    <input type="text" id="question" placeholder="Ask a question..." />
    <button onclick="askQuestion()">Ask</button>

    <script>
        const chat = document.getElementById("chat");
        const status = document.getElementById("upload-status");

        async function uploadPdf() {
            const fileInput = document.getElementById("pdfFile");
            if (!fileInput.files.length) {
                status.textContent = "Please choose a PDF first.";
                return;
            }
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            status.textContent = "Uploading...";
            const res = await fetch("/upload", { method: "POST", body: formData });
            const data = await res.json();
            status.textContent = `${data.filename}: ${data.status}`;
        }

        async function askQuestion() {
            const input = document.getElementById("question");
            const question = input.value.trim();
            if (!question) return;

            addMessage("You", question, "user");
            input.value = "";

            const res = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question }),
            });
            const data = await res.json();
            addMessage("Bot", data.answer || data.error, "bot");
        }

        function addMessage(sender, text, cssClass) {
            const div = document.createElement("div");
            div.className = "msg " + cssClass;
            div.textContent = `${sender}: ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById("question").addEventListener("keydown", (e) => {
            if (e.key === "Enter") askQuestion();
        });
    </script>
</body>
</html>
